name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check && npm audit --audit-level=high
        working-directory: frontend

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 14

  security:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.185.0
      - run: semgrep scan --config security/semgrep.yml --error --metrics=off frontend/src backend/src/main
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git,.local,frontend/node_modules,backend/target

  containers:
    name: Containers and Oracle
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: iam-ci
      DB_USERNAME: iam_app
      JDBC_URL: jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Generate disposable database credentials
        run: |
          for key in ORACLE_PASSWORD DB_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - run: docker compose up --build --detach --wait --wait-timeout 600
      - run: bash scripts/smoke.sh
      - run: bash ./mvnw --batch-mode --no-transfer-progress -Poracle-it verify
        working-directory: backend
      - name: Reclaim disposable database and builder storage before image scans
        run: |
          docker compose down --volumes --remove-orphans
          docker image rm gvenzl/oracle-free:23-slim-faststart
          docker builder prune --all --force
          df -h /
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-backend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-frontend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Save the tested images for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o images.tar iam-backend:local iam-frontend:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-images
          path: images.tar
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-test-results
          path: backend/target/failsafe-reports/
          retention-days: 14
      - run: docker compose logs --no-color --tail=100
        if: failure()
      - run: docker compose down --volumes --remove-orphans
        if: always()

  gate:
    name: CI gate
    if: always()
    needs: [frontend, backend, security, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY

  publish:
    name: Publish tested images
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
      - run: docker load -i images.tar
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and record immutable image references
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in frontend backend; do
            tag="$prefix/$component:sha-$GITHUB_SHA"
            docker tag "iam-$component:local" "$tag"
            docker push "$tag"
            docker inspect "$tag" --format '{{json .RepoDigests}}' > "$component-digests.json"
          done
          python3 - <<'PY'
          import json, os
          prefix = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          manifest = {'git_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID']}
          for component in ('frontend', 'backend'):
              with open(component + '-digests.json') as f:
                  manifest[component + '_image'] = next(d for d in json.load(f) if d.startswith(prefix + '/' + component + '@sha256:'))
          with open('release.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release.json
          retention-days: 90
