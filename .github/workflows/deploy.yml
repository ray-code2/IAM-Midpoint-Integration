name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main-push CI run ID containing a release-manifest artifact
        required: true
        type: string
      environment:
        description: Promote the same tested images to this environment
        required: true
        type: choice
        options: [development, uat, production]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release provenance
    if: >-
      vars.DEPLOYMENTS_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.DEV_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.manifest.outputs.environment }}
      frontend_image: ${{ steps.manifest.outputs.frontend_image }}
      backend_image: ${{ steps.manifest.outputs.backend_image }}
      git_sha: ${{ steps.manifest.outputs.git_sha }}
      release_run_id: ${{ steps.manifest.outputs.release_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id || github.event.workflow_run.id }}
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'development' }}
    steps:
      - name: Verify a successful push from this repository's main branch
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          with open('run.json') as f:
              run = json.load(f)
          assert run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/ci.yml'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}
          path: release
      - id: manifest
        name: Validate digest references and bind them to the verified commit
        run: |
          python3 - <<'PY'
          import json, os, re
          with open('release/release.json') as f:
              manifest = json.load(f)
          with open('run.json') as f:
              run = json.load(f)
          assert manifest['git_sha'] == run['head_sha']
          assert str(manifest['run_id']) == os.environ['RELEASE_RUN_ID']
          assert re.fullmatch(r'[0-9a-f]{40}', manifest['git_sha'])
          environment = os.environ['TARGET_ENVIRONMENT']
          assert environment in ('development', 'uat', 'production')
          prefix = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for component in ('frontend', 'backend'):
                  image = manifest[component + '_image']
                  assert re.fullmatch(re.escape(prefix + '/' + component) + r'@sha256:[0-9a-f]{64}', image)
                  print(component + '_image=' + image, file=output)
              print('git_sha=' + manifest['git_sha'], file=output)
              print('environment=' + environment, file=output)
              print('release_run_id=' + os.environ['RELEASE_RUN_ID'], file=output)
          PY

  deploy:
    name: Deploy verified images
    needs: prepare
    runs-on: [self-hosted, linux, x64, 'iam-${{ needs.prepare.outputs.environment }}']
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 15
    env:
      DEPLOY_ENV: ${{ needs.prepare.outputs.environment }}
      FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
      BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
      RELEASE_SHA: ${{ needs.prepare.outputs.git_sha }}
      RELEASE_RUN_ID: ${{ needs.prepare.outputs.release_run_id }}
      JDBC_URL: ${{ vars.JDBC_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_PORT: ${{ vars.APP_PORT || '8088' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/deploy.sh
      - name: Record deployment evidence
        run: |
          {
            echo "Environment: $DEPLOY_ENV"
            echo "Commit: $RELEASE_SHA"
            echo "Frontend: $FRONTEND_IMAGE"
            echo "Backend: $BACKEND_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
