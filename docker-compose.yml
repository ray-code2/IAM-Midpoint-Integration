name: iam-local
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: iam_app
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
  backend:
    image: iam-backend:local
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: iam_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      oracle:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
  frontend:
    image: iam-frontend:local
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
volumes:
  oracle-data:
